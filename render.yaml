services:
  - type: web
    runtime: static
    name: finanzas-sin-filtro
    branch: main
    buildCommand: echo "Sitio estático listo"
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Los commits quedan disponibles en GitHub, pero solo se publican cuando
    # el bloque haya sido revisado y se lance un Manual Deploy en Render.
    autoDeployTrigger: off
